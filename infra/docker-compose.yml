services:
  api:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    container_name: sports-alerts-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////var/data/sports-alerts.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/backend:/app/services/backend
      - sqlite_data:/var/data
    working_dir: /app/services/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 180s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: sports-alerts-web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
    working_dir: /app/apps/web
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "rm -rf /app/apps/web/node_modules/.vite && npm ci --include=optional && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  sqlite_data:
  web_node_modules:
